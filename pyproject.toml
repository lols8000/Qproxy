[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qproxy-adblock"
version = "0.4.0"
description = "Windows packet-level (WinDivert WFP) and local DNS/proxy ad blocker with fast DNS caching and browser companion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Qproxy"}]
license = {text = "MIT"}

[project.scripts]
qproxy = "qproxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qproxy*"]
